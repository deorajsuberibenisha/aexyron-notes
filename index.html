<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/aexyron-notes/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aexyron Notes - handwriting and PDF notes">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#140F3F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aexyron Notes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Aexyron Notes</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #140F3F; }
    /* Branded splash shown while the engine loads; removed on Flutter's first frame. */
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(120% 90% at 25% 15%, #3B20C0 0%, #140F3F 60%); transition: opacity .45s ease; z-index: 10; }
    #splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 18px 40px #06041c88; animation: breathe 1.8s ease-in-out infinite; }
    #splash div { width: 120px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, #4FF0D2, #FFC94D); transform-origin: left; animation: load 1.4s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(1.05); } }
    @keyframes load { 0% { transform: scaleX(.1); opacity: .4 } 50% { transform: scaleX(1); opacity: 1 } 100% { transform: scaleX(.1); opacity: .4 } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-512.png" alt="Aexyron Notes"><div></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 500); }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="aexyron_scan.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
