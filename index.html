          requestAnimationFrame(function () { requestAnimationFrame(function () { setTimeout(hide, 80); }); });
        }
      }).observe(document.body, { childList: true, subtree: true });
    })();

            'background:rgba(59,32,192,.12);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;' +
            'font:800 20px Roboto,system-ui,sans-serif;color:#3B20C0;pointer-events:none;transition:opacity .15s';
          shade.textContent = 'Drop PDFs or pictures to add them';
          document.body.appendChild(shade);
        }
        shade.style.opacity = on ? '1' : '0';

      function deliver(name, bytes) { if (handler) handler(name, bytes); else queue.push([name, bytes]); }
      window.aexyronOnDrop = function (fn) {

      window.addEventListener('dragenter', function (e) { if (!hasFiles(e)) return; e.preventDefault(); depth++; show(true); });

      window.addEventListener('drop', function (e) {

        e.preventDefault(); depth = 0; show(false);
        Array.prototype.forEach.call(e.dataTransfer.files, function (f) {
          if (!/\.(pdf|png|jpe?g|webp|gif|heic)$/i.test(f.name) && !/^(application\/pdf|image\/)/.test(f.type)) return;
          f.arrayBuffer().then(function (buf) { deliver(f.name, new Uint8Array(buf)); });

    // Nothing is sent anywhere: the device checks it's you and says yes or no.

      function b64(buf) { var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);

        } catch (e) { return Promise.resolve(false); }
      };
      window.aexyronBioEnrol = function () {
        try {
          return navigator.credentials.create({ publicKey: {
            rp: { name: 'Aexyron Notes' },
            user: { id: rnd(16), name: 'Aexyron Notes', displayName: 'Aexyron Notes app lock' },
            challenge: rnd(32),
            pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },

          } }).then(function (c) { return c ? b64(c.rawId) : ''; }, function () { return ''; });
        } catch (e) { return Promise.resolve(''); }
      };
      window.aexyronBioVerify = function (id) {
        try {
          return navigator.credentials.get({ publicKey: {
            challenge: rnd(32),
            allowCredentials: [{ type: 'public-key', id: unb64(id), transports: ['internal', 'hybrid'] }],

      };
    })();

    // Take a photo: phones and tablets open the camera; computers pick a picture.
    window.aexyronTakePhoto = function () {
      return new Promise(function (resolve) {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.setAttribute('capture', 'environment');
        input.style.display = 'none';
        var done = false;
        input.addEventListener('change', function () {
          done = true;
          var f = input.files && input.files[0];

          if (!f) { resolve(null); return; }
          f.arrayBuffer().then(function (b) { resolve(new Uint8Array(b)); }, function () { resolve(null); });
        });
        input.addEventListener('cancel', function () { if (!done) { input.remove(); resolve(null); } });
        document.body.appendChild(input);
        input.click();
      });
    };

    // Audio recorded while writing, and playing it back from any moment.
    (function () {
      var rec = null, chunks = [], stream = null, mime = '';
      window.aexyronRecStart = function () {
        if (!navigator.mediaDevices || !window.MediaRecorder) return Promise.resolve(false);
        return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {

      window.aexyronPlay = function (bytes, type, at) {

    // Print a PDF through a hidden frame (the browser's own print dialog).
    window.aexyronPrintPdf = function (bytes) {
      return new Promise(function (resolve) {
        try {
          var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
          var frame = document.createElement('iframe');
          frame.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;border:0;bottom:0;right:0';
          frame.src = url;
