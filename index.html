<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/aexyron-notes/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aexyron Notes - handwriting and PDF notes">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140F3F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aexyron Notes">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Aexyron Notes</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #140F3F; overflow: hidden;
      /* No pull-to-refresh, bounce, text-selection or long-press pop-ups while writing. */
      overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    /* Branded splash shown while the engine loads; removed on Flutter's first frame. */
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(120% 90% at 25% 15%, #3B20C0 0%, #140F3F 60%); transition: opacity .45s ease; z-index: 10; }
    #splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 18px 40px #06041c88; animation: breathe 1.8s ease-in-out infinite; }
    #splash div { width: 120px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, #4FF0D2, #FFC94D); transform-origin: left; animation: load 1.4s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(1.05); } }
    @keyframes load { 0% { transform: scaleX(.1); opacity: .4 } 50% { transform: scaleX(1); opacity: 1 } 100% { transform: scaleX(.1); opacity: .4 } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-512.png" alt="Aexyron Notes"><div></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 500); }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Install as an app anywhere: Chrome/Edge (Android, Windows, Mac, Linux) offer a
    // prompt we keep for the in-app Install button; iPhone/iPad use Add to Home Screen.
    window.__aexInstall = null;
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__aexInstall = e; });
    window.addEventListener('appinstalled', function () { window.__aexInstall = null; window.__aexInstalled = true; });
    window.aexyronInstallState = function () {
      var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (standalone || window.__aexInstalled) return 'installed';
      if (window.__aexInstall) return 'prompt';
      var ua = navigator.userAgent;
      var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      return ios ? 'ios' : 'manual';
    };
    window.aexyronInstall = function () {
      var e = window.__aexInstall;
      if (!e) return Promise.resolve('unavailable');
      e.prompt();
      return e.userChoice.then(function (c) { window.__aexInstall = null; return c.outcome; });
    };
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
          // A newer version already downloaded and waiting: let it take over now.
          var nudge = function () { if (reg.waiting) reg.waiting.postMessage('skipWaiting'); };
          nudge();
          reg.addEventListener('updatefound', function () {
            var w = reg.installing;
            if (w) w.addEventListener('statechange', function () { if (w.state === 'installed') nudge(); });
          });
          // Look for a newer version whenever the app comes back to the front.
          document.addEventListener('visibilitychange', function () { if (!document.hidden) reg.update().catch(function () {}); });
        }).catch(function () {});
      });
      // A newer version just took over: if you haven't started writing yet, switch to it
      // at once; otherwise wait until the app is in the background, so nothing is interrupted.
      var touched = false;
      ['pointerdown', 'keydown'].forEach(function (ev) { window.addEventListener(ev, function () { touched = true; }, { once: true, capture: true }); });
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) { hadController = true; return; } // first install, nothing to update
        if (!touched) { location.reload(); return; }
        document.addEventListener('visibilitychange', function () { if (document.hidden) location.reload(); }, { once: true });
      });
    }
  </script>
  <script src="aexyron_scan.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
